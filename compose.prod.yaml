services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-rh-system:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-hr-extras}"
      DB_USERNAME: "${DB_USERNAME:-sail}"
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    volumes:
      - prod-public:/var/www/html/public
      - prod-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rh-lan

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Exposes HTTP on all host interfaces (0.0.0.0) so any device on the LAN can connect
      - "0.0.0.0:${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - prod-public:/var/www/html/public:ro
      - prod-storage:/var/www/html/storage:ro
    networks:
      - rh-lan

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE:-hr-extras}"
      MYSQL_USER: "${DB_USERNAME:-sail}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - prod-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rh-lan

networks:
  rh-lan:
    driver: bridge

volumes:
  prod-public:
    driver: local
  prod-storage:
    driver: local
  prod-mysql:
    driver: local
