services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-rh-system:latest}
    restart: always
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-hr-extras}"
      DB_USERNAME: "${DB_USERNAME:-sail}"
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    volumes:
      - prod-public:/var/www/html/public
      - prod-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rh-lan

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - app
    environment:
      SSL_DOMAIN: "${SSL_DOMAIN:-localhost}"
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
    volumes:
      - prod-public:/var/www/html/public:ro
      - prod-storage:/var/www/html/storage:ro
      - ./docker/certs:/etc/nginx/certs
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /etc/nginx/certs &&
        if [ ! -f /etc/nginx/certs/server.crt ] || [ ! -f /etc/nginx/certs/server.key ]; then
          apk add --no-cache openssl >/dev/null 2>&1 &&
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048
            -keyout /etc/nginx/certs/server.key
            -out /etc/nginx/certs/server.crt
            -subj "/C=MX/ST=State/L=City/O=Silgan/CN=$${SSL_DOMAIN:-localhost}";
        fi &&
        printf '%s\n'
        'server {'
        '    listen 80;'
        '    listen [::]:80;'
        '    listen 443 ssl;'
        '    listen [::]:443 ssl;'
        '    server_name _;'
        '    ssl_certificate /etc/nginx/certs/server.crt;'
        '    ssl_certificate_key /etc/nginx/certs/server.key;'
        '    ssl_protocols TLSv1.2 TLSv1.3;'
        '    ssl_ciphers HIGH:!aNULL:!MD5;'
        '    root /var/www/html/public;'
        '    index index.php;'
        '    charset utf-8;'
        '    client_max_body_size 20M;'
        '    resolver 127.0.0.11 valid=30s ipv6=off;'
        '    location / {'
        '        try_files $$uri $$uri/ /index.php?$$query_string;'
        '    }'
        '    location = /favicon.ico { access_log off; log_not_found off; }'
        '    location = /robots.txt  { access_log off; log_not_found off; }'
        '    error_page 404 /index.php;'
        '    location ~ \.php$$ {'
        '        set $$upstream app:9000;'
        '        fastcgi_pass $$upstream;'
        '        fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;'
        '        include fastcgi_params;'
        '        fastcgi_param HTTP_X_REAL_IP $$remote_addr;'
        '        fastcgi_param HTTP_X_FORWARDED_FOR $$proxy_add_x_forwarded_for;'
        '        fastcgi_param HTTP_X_FORWARDED_PROTO $$scheme;'
        '        fastcgi_read_timeout 300s;'
        '        fastcgi_buffers 16 16k;'
        '        fastcgi_buffer_size 32k;'
        '    }'
        '    location ~ /\.(?!well-known).* {'
        '        deny all;'
        '    }'
        '}' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    networks:
      - rh-lan
  mysql:
    image: mysql:8.4
    restart: always
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE:-hr-extras}"
      MYSQL_USER: "${DB_USERNAME:-sail}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - prod-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rh-lan

networks:
  rh-lan:
    driver: bridge

volumes:
  prod-public:
    driver: local
  prod-storage:
    driver: local
  prod-mysql:
    driver: local
