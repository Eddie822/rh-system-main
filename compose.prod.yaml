services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-rh-system:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-rh_system}
      DB_USERNAME: ${DB_USERNAME:-rh_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - prod-public:/var/www/html/public
      - prod-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rh-lan

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Exposes HTTP on all host interfaces (0.0.0.0) so any device on the LAN can connect
      - "0.0.0.0:${HTTP_PORT:-80}:80"
    volumes:
      - prod-public:/var/www/html/public:ro
      - prod-storage:/var/www/html/storage:ro
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
            listen 80;
            listen [::]:80;
            server_name _;

            root /var/www/html/public;
            index index.php;

            charset utf-8;
            client_max_body_size 10M;

            location / {
                try_files $$uri $$uri/ /index.php?$$query_string;
            }

            location = /favicon.ico { access_log off; log_not_found off; }
            location = /robots.txt  { access_log off; log_not_found off; }

            error_page 404 /index.php;

            location ~ \.php$$ {
                fastcgi_pass app:9000;
                fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
                include fastcgi_params;
                fastcgi_param HTTP_X_REAL_IP $$remote_addr;
                fastcgi_param HTTP_X_FORWARDED_FOR $$proxy_add_x_forwarded_for;
                fastcgi_param HTTP_X_FORWARDED_PROTO $$scheme;
                fastcgi_read_timeout 300s;
                fastcgi_buffers 16 16k;
                fastcgi_buffer_size 32k;
            }

            location ~ /\.(?!well-known).* {
                deny all;
            }
        }
        EOF
        exec nginx -g 'daemon off;'
    networks:
      - rh-lan

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-secret}}
      MYSQL_DATABASE: ${DB_DATABASE:-rh_system}
      MYSQL_USER: ${DB_USERNAME:-rh_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - prod-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rh-lan

networks:
  rh-lan:
    driver: bridge

volumes:
  prod-public:
    driver: local
  prod-storage:
    driver: local
  prod-mysql:
    driver: local
